<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Редактор сайта — Math</title>
</head>
<body>
  <!--
    Decap CMS — редактор контента для статического хостинга (Netlify).

    Как это работает:
      • вход через «Войти с GitHub» (обычная авторизация GitHub, Netlify Identity не нужна);
      • все правки сохраняются в data/content.json в репозитории;
      • Netlify видит коммит и сам пересобирает сайт.

    Настройки берутся из соседнего файла config.yml — Decap подхватывает его сам,
    поэтому никакого ручного CMS.init() здесь быть не должно.
  -->
  <script src="https://unpkg.com/decap-cms@^3.3.3/dist/decap-cms.js"></script>
</body>
</html>
